<!-- chinese-secret-societies-in-malaya · crimson -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <title>Cover — The Impact of Chinese Secret Societies in Malaya by Wilfred Blythe</title>

  <defs>
    <!-- CSS 165deg over a 600x800 box, resolved to user space (same vector as every sibling) -->
    <linearGradient id="crimson-bg" gradientUnits="userSpaceOnUse" x1="180" y1="-48" x2="420" y2="848">
      <stop offset="0" stop-color="#341416"/>
      <stop offset="0.55" stop-color="#1f0c0d"/>
      <stop offset="1" stop-color="#130808"/>
    </linearGradient>

    <radialGradient id="crimson-glow" gradientUnits="userSpaceOnUse" cx="300" cy="40" r="440">
      <stop offset="0" stop-color="#ef4d4d" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ef4d4d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="crimson-glow-corner" gradientUnits="userSpaceOnUse" cx="560" cy="780" r="400">
      <stop offset="0" stop-color="#f88b8b" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f88b8b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="crimson-scrim" gradientUnits="userSpaceOnUse" x1="300" y1="560" x2="300" y2="800">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <radialGradient id="crimson-halo">
      <stop offset="0" stop-color="#ef4d4d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ef4d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- GROUND -->
  <rect x="0" y="0" width="600" height="800" fill="url(#crimson-bg)"/>
  <circle cx="300" cy="40" r="440" fill="url(#crimson-glow)"/>
  <circle cx="560" cy="780" r="400" fill="url(#crimson-glow-corner)"/>
  <rect x="0" y="560" width="600" height="240" fill="url(#crimson-scrim)"/>

  <!-- PLINTH · painted BEFORE the frame so the frame stroke and the corner brackets pass over the
       band. Rule set on the type measure (110-490) at y=756: its stroke (754-758) clears the
       frame's bottom stroke (772-776) by 14 and misses both bottom brackets, whose horizontal
       arms run x26-100 / x500-574 along y=774. The band is full-bleed (x0-600, y742-800) and the
       rule runs x110-490, so it is only their LEFT ends that lie inside the star-badge zone
       (x0-260, y690-800); decorative marks may pass under chrome, words may not. No text ever
       enters the plinth. -->
  <rect x="0" y="742" width="600" height="58" fill="#ef4d4d" opacity="0.10"/>
  <line x1="110" y1="756" x2="490" y2="756" stroke="#ef4d4d" stroke-width="4" opacity="0.7"/>

  <!-- FRAME · inset 26, so rx = 56 - 26 = 30 (optically concentric with the card's 14px clip).
       Paint is hex + stroke-opacity, never rgba(): that is CSS Color syntax, not SVG 1.1 <paint>,
       and strict rasterisers (resvg, librsvg, Inkscape) drop the declaration and lose the frame. -->
  <rect x="26" y="26" width="548" height="748" rx="30" fill="none" stroke="#ef4d4d" stroke-opacity="0.5" stroke-width="4"/>
  <g fill="none" stroke="#ef4d4d" stroke-width="6" stroke-linecap="square">
    <path d="M 26 100 L 26 56 A 30 30 0 0 1 56 26 L 100 26"/>
    <path d="M 500 26 L 544 26 A 30 30 0 0 1 574 56 L 574 100"/>
    <path d="M 574 700 L 574 744 A 30 30 0 0 1 544 774 L 500 774"/>
    <path d="M 100 774 L 56 774 A 30 30 0 0 1 26 744 L 26 700"/>
  </g>

  <!-- GLYPH · OVERLAPPING TERRITORIES — two closed orders of equal size holding common ground,
       inside the 240x150 glyph box x180-420 / y183-333, centre (300,258).
       Module M=45 on the 15-grid: r=75 rings at (255,258) and (345,258), so the pair spans the
       box edge to edge (180-420 / 183-333) with no crop. Half-separation 45 and r 75 make a
       3-4-5 triangle, so the rings cross exactly on the grid at (300,198) and (300,318).
       THE OVERLAP IS LEFT EMPTY. Nothing sits on the shared axis x=300 and nothing marks the
       crossings, so the figure reads as two jurisdictions over one territory. The earlier
       version put a hot ring dead centre and a tick at each crossing; almond + centre + lid
       marks resolves into an eye, which on this subject lands on the all-seeing-eye trope the
       brief rules out. Both are gone, and those 24-unit ticks did not survive the 4x reduction
       anyway — 3.75 units of each was buried in the crossing stroke band (y194.25-201.75).
       Both orders now carry enough ink to hold on a dim display (0.75 / 0.92; the left ring was
       0.60 and effectively dropped out at 1.5 CSS px). Their difference is carried by the bead,
       not by alpha: the r=15 accent-2 bead sits at (210,318), a grid point on the FAINTER ring's
       circumference (45-60-75), so the weaker order is the marked one and neither outranks the
       other. Its offset also breaks the mirror symmetry of the pair. Area pi*15^2 = 707 square
       units, inside the ~900 cap, and the only full-opacity mark in the file.
       3 drawn marks, nothing under stroke-width 6 — the figure has to survive a 4x reduction to
       a 150px card. Abstract by construction: no emblem, no seal, no figure, no script. -->
  <ellipse cx="300" cy="258" rx="150" ry="110" fill="url(#crimson-halo)"/>
  <g fill="none" stroke="#ef4d4d" stroke-width="6">
    <circle cx="255" cy="258" r="75" opacity="0.75"/>
    <circle cx="345" cy="258" r="75" opacity="0.92"/>
  </g>
  <circle cx="210" cy="318" r="15" fill="#f88b8b"/>

  <!-- TYPE · three sizes: 92 / 32 / 30. The contract allows four; the fourth is spare.
       x is offset by letter-spacing/2 so middle-anchored tracked lines land on the true x=300
       axis, registering with the glyph and the rule.
       FULL TITLE. The book's main title is "The Impact of Chinese Secret Societies in Malaya",
       so the card sets it whole — italic lead-in, roman word, italic tail — the way every
       sibling spells its main title across `the` + `word`. The tail is the same 30 italic as
       the lead-in, so the two read as one voice bracketing the word rather than as a new rank.
       MEASURED in Chromium with Georgia actually resolved (getBBox + canvas ink metrics, not
       estimated). Replace these if you re-cut the type; do not trust the old figures:
         "Societies" at 92 is 425.6 units wide, advance box x87.5-513.0, ink x85.5-510.4 — NOT
         the ~390 once claimed here. Real clearance to the x60-540 measure is ~27 units a side,
         not ~75. The old "~450 on a wide Palatino fallback" was backwards as well: Palatino
         Linotype sets it at 373 and Times at 337, both NARROWER than Georgia. The only wider
         case is a Linux generic serif (DejaVu Serif Bold ~5.03em), which would take it to ~467
         and leave ~7. This one number guards the title measure: a longer word at 92 overruns,
         so drop the size before lengthening the line.
         "The Impact of Chinese" at 30 is 329.4 with tracking (it was 369.1 at 34, not ~382).
         "in Malaya" at 30 is 152.1. Both sit well inside the 480 measure.
       LEADING. 83 = 0.90F between the title lines, the house advance; neither carries a
       descender. The lead-in drops from 34 to 30 and lifts from 378 to 370 because "Impact"
       does carry one: its p bottoms at y377, under the topmost ink of "Secret" (the t, at
       y404). That is 27 units of real white where 34/378 left 19 — back in the house range,
       which runs 25-32 on the siblings. The tail sits closer in (ink y567 against the y555
       bottom of "Societies", 12 units) on purpose: it continues the title's own sentence, so it
       binds to the word while the lead-in floats. It clears the rule stroke (609.5) by 12.5.
       TSPANS. The two title tspans are written with NO whitespace between them. Any newline or
       indent there collapses to a space that is counted into the first chunk's advance, and a
       middle-anchored "Secret" then sits ~12 units left of "Societies".
       `kicker`, `sub`, `note` and `blurb` are omitted by HOUSE CONVENTION, not by the contract.
       15 units is a minimum type size, not a ceiling on fields, and a fourth size is still free:
       nothing in the spec forbids restoring them. Every sibling sets three lines and parks the
       rest on the book page, and at card size these would be a grey smear under the title. -->
  <text x="300.75" y="370" text-anchor="middle"
        font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif"
        font-style="italic" font-weight="500" font-size="30" letter-spacing="1.5"
        fill="#e6c4c4" opacity="0.95">The Impact of Chinese</text>

  <text text-anchor="middle"
        font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif"
        font-weight="700" font-size="92" letter-spacing="0.5" fill="#ffffff"><tspan x="300.25" y="470">Secret</tspan><tspan x="300.25" y="553">Societies</tspan></text>

  <text x="300.75" y="590" text-anchor="middle"
        font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif"
        font-style="italic" font-weight="500" font-size="30" letter-spacing="1.5"
        fill="#e6c4c4" opacity="0.95">in Malaya</text>

  <line x1="255" y1="612" x2="345" y2="612" stroke="#ef4d4d" stroke-width="5" opacity="0.9"/>

  <text x="302.25" y="662" text-anchor="middle"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace"
        font-weight="700" font-size="32" letter-spacing="4.5"
        fill="#f8b4b4">WILFRED BLYTHE</text>
</svg>
